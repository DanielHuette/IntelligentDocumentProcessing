name: Keep demo awake

# Hugging Face Spaces on CPU basic sleep after 48 hours without visitors, and free Supabase
# projects pause after a week without database activity. One request a day keeps both running.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_FORM_URL != '' }}
    steps:
      - name: Load the demo form
        run: curl --silent --show-error --fail --max-time 300 --retry 3 --retry-delay 60 "${{ vars.DEMO_FORM_URL }}" --output /dev/null
